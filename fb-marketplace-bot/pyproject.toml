[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fbmarket"
version = "0.1.0"
description = "Facebook Marketplace deal watcher: alerts you when new listings match your searches"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pyyaml>=6", "playwright>=1.44"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fbmarket = "fbmarket.cli:main"

[tool.setuptools]
packages = ["fbmarket"]

[tool.pytest.ini_options]
pythonpath = ["."]
