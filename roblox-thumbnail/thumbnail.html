<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=block" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#1b0b3a;overflow:hidden}
  svg{display:block}
  .t{font-family:'Luckiest Guy',sans-serif}
  #defs{position:absolute;width:0;height:0}
  .scene{display:none}
  body.thumb #thumb, body.icon #icon{display:block}
</style></head>
<body>
<svg id="defs" xmlns="http://www.w3.org/2000/svg"><defs>
  <radialGradient id="bg" cx="65%" cy="50%" r="80%">
    <stop offset="0" stop-color="#ff7ad9"/><stop offset=".35" stop-color="#8b3dff"/><stop offset="1" stop-color="#1e0a5c"/>
  </radialGradient>
  <radialGradient id="bgIcon" cx="50%" cy="58%" r="75%">
    <stop offset="0" stop-color="#ff7ad9"/><stop offset=".4" stop-color="#8b3dff"/><stop offset="1" stop-color="#1e0a5c"/>
  </radialGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#fff6a8" stop-opacity=".95"/><stop offset=".45" stop-color="#ffd23f" stop-opacity=".45"/><stop offset="1" stop-color="#ffd23f" stop-opacity="0"/></radialGradient>
  <linearGradient id="titleFill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff7b0"/><stop offset=".45" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff8a1f"/>
  </linearGradient>
  <linearGradient id="title2Fill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#bff3ff"/><stop offset="1" stop-color="#5fd0ff"/>
  </linearGradient>
  <linearGradient id="topFace" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1e9ff"/></linearGradient>
  <linearGradient id="leftFace" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9ddff"/><stop offset="1" stop-color="#c9b4f5"/></linearGradient>
  <linearGradient id="rightFace" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cdb8f7"/><stop offset="1" stop-color="#a98ae8"/></linearGradient>
  <linearGradient id="mythic" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff4fa3"/><stop offset=".25" stop-color="#ffb627"/><stop offset=".5" stop-color="#3ee07a"/><stop offset=".75" stop-color="#36b6ff"/><stop offset="1" stop-color="#b46bff"/>
  </linearGradient>
  <linearGradient id="legend" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#ff9f1c"/></linearGradient>
  <linearGradient id="rare" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fd6ff"/><stop offset="1" stop-color="#2f7bff"/></linearGradient>
  <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5dff9b"/><stop offset="1" stop-color="#14b85a"/></linearGradient>

  <!-- rays: 16 wedges around origin -->
  <g id="rays">
    <script>/* filled below */</script>
  </g>

  <symbol id="spark" viewBox="-50 -50 100 100">
    <path d="M0,-50 C6,-12 12,-6 50,0 C12,6 6,12 0,50 C-6,12 -12,6 -50,0 C-12,-6 -6,-12 0,-50Z" fill="#fff"/>
  </symbol>

  <!-- paw in 100x100 -->
  <g id="paw">
    <ellipse cx="50" cy="63" rx="17" ry="14"/>
    <circle cx="28" cy="42" r="8"/><circle cx="42" cy="30" r="8.5"/>
    <circle cx="58" cy="30" r="8.5"/><circle cx="72" cy="42" r="8"/>
  </g>

  <!-- isometric dice, centered at 0,0 -->
  <g id="dice">
    <g stroke="#2a1150" stroke-width="12" stroke-linejoin="round">
      <polygon points="0,-170 150,-85 0,0 -150,-85" fill="url(#topFace)"/>
      <polygon points="-150,-85 0,0 0,170 -150,85" fill="url(#leftFace)"/>
      <polygon points="0,0 150,-85 150,85 0,170" fill="url(#rightFace)"/>
    </g>
    <!-- highlights -->
    <polyline points="-118,-82 0,-150 40,-128" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".9"/>
    <!-- top face: 1 big paw -->
    <g transform="matrix(1.5,0.85,-1.5,0.85,0,-170)" fill="#ff4fa3">
      <use href="#paw" transform="translate(50,50) scale(.62) translate(-50,-50)"/>
    </g>
    <!-- left face: 2 paws -->
    <g transform="matrix(1.5,0.85,0,1.7,-150,-85)" fill="#8b3dff">
      <use href="#paw" transform="translate(28,28) scale(.38) translate(-50,-50)"/>
      <use href="#paw" transform="translate(72,72) scale(.38) translate(-50,-50)"/>
    </g>
    <!-- right face: 3 paws -->
    <g transform="matrix(1.5,-0.85,0,1.7,0,0)" fill="#5b1fd1">
      <use href="#paw" transform="translate(25,25) scale(.32) translate(-50,-50)"/>
      <use href="#paw" transform="translate(50,50) scale(.32) translate(-50,-50)"/>
      <use href="#paw" transform="translate(75,75) scale(.32) translate(-50,-50)"/>
    </g>
  </g>

  <!-- shared face bits -->
  <g id="eyes">
    <ellipse cx="72" cy="112" rx="14" ry="17" fill="#1a0d33"/>
    <ellipse cx="128" cy="112" rx="14" ry="17" fill="#1a0d33"/>
    <circle cx="67" cy="105" r="6" fill="#fff"/><circle cx="123" cy="105" r="6" fill="#fff"/>
    <circle cx="77" cy="119" r="3" fill="#fff"/><circle cx="133" cy="119" r="3" fill="#fff"/>
    <ellipse cx="50" cy="138" rx="12" ry="7" fill="#ff5fa2" opacity=".55"/>
    <ellipse cx="150" cy="138" rx="12" ry="7" fill="#ff5fa2" opacity=".55"/>
  </g>

  <!-- CAT (200x200 box) -->
  <g id="cat" stroke="#2a1150" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <path d="M38,88 L46,18 L94,52 Z" fill="#ffa94d"/><path d="M162,88 L154,18 L106,52 Z" fill="#ffa94d"/>
    <path d="M50,70 L53,36 L78,54 Z" fill="#ffb3cf" stroke="none"/><path d="M150,70 L147,36 L122,54 Z" fill="#ffb3cf" stroke="none"/>
    <ellipse cx="100" cy="112" rx="80" ry="68" fill="#ffa94d"/>
    <path d="M100,46 v16 M84,49 l3,13 M116,49 l-3,13" stroke="#d9711c" stroke-width="7" fill="none"/>
    <use href="#eyes" stroke="none"/>
    <path d="M94,128 h12 l-6,7 z" fill="#ff5fa2" stroke-width="3"/>
    <path d="M86,138 q7,9 14,0 q7,9 14,0" fill="none" stroke-width="5"/>
    <path d="M30,122 l-22,-4 M30,132 l-22,4 M170,122 l22,-4 M170,132 l22,4" stroke-width="4" fill="none"/>
  </g>

  <!-- DOG -->
  <g id="dog" stroke="#2a1150" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="100" cy="112" rx="78" ry="68" fill="#f2c08a"/>
    <path d="M118,62 q30,-14 46,10 q8,26 -16,40 q-28,-10 -30,-50z" fill="#b97a45" stroke="none"/>
    <path d="M40,58 q-36,6 -30,62 q4,26 22,18 q14,-30 22,-70z" fill="#8a5530"/>
    <path d="M160,58 q36,6 30,62 q-4,26 -22,18 q-14,-30 -22,-70z" fill="#8a5530"/>
    <use href="#eyes" stroke="none"/>
    <ellipse cx="100" cy="144" rx="32" ry="22" fill="#fff4e6" stroke-width="5"/>
    <path d="M100,148 v8 M90,156 q10,8 20,0" fill="none" stroke-width="4"/>
    <path d="M94,158 q6,18 12,0" fill="#ff5f7e" stroke-width="4"/>
    <ellipse cx="100" cy="137" rx="11" ry="8" fill="#1a0d33" stroke="none"/>
  </g>

  <!-- DRAGON -->
  <g id="dragon" stroke="#2a1150" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <path d="M30,96 q-34,-40 -26,-78 q22,20 52,30 z" fill="#b46bff"/>
    <path d="M170,96 q34,-40 26,-78 q-22,20 -52,30 z" fill="#b46bff"/>
    <path d="M62,56 q-10,-34 6,-52 q8,26 22,40z" fill="#ffd23f"/>
    <path d="M138,56 q10,-34 -6,-52 q-8,26 -22,40z" fill="#ffd23f"/>
    <ellipse cx="100" cy="112" rx="80" ry="68" fill="#3ee07a"/>
    <path d="M86,46 l14,-16 l14,16" fill="#ffd23f"/>
    <use href="#eyes" stroke="none"/>
    <ellipse cx="100" cy="146" rx="38" ry="22" fill="#a8f5c4" stroke-width="5"/>
    <circle cx="90" cy="140" r="3.5" fill="#1a0d33" stroke="none"/><circle cx="110" cy="140" r="3.5" fill="#1a0d33" stroke="none"/>
    <path d="M84,152 q16,12 32,0" fill="none" stroke-width="5"/>
    <path d="M90,153 l4,8 l4,-7 M102,154 l4,7 l4,-8" fill="#fff" stroke-width="3"/>
  </g>
</defs></svg>

<!-- ===================== THUMBNAIL 1920x1080 ===================== -->
<svg id="thumb" class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <g transform="translate(1330,560)" class="raysHere" opacity=".22"></g>
  <circle cx="1330" cy="560" r="520" fill="url(#glow)"/>
  <!-- sparkles -->
  <g fill="#fff">
    <use href="#spark" x="1040" y="140" width="70" height="70" opacity=".9"/>
    <use href="#spark" x="1760" y="470" width="56" height="56" opacity=".85"/>
    <use href="#spark" x="1080" y="880" width="60" height="60" opacity=".8"/>
    <use href="#spark" x="930" y="560" width="40" height="40" opacity=".7"/>
    <use href="#spark" x="1830" y="120" width="44" height="44" opacity=".7"/>
    <use href="#spark" x="90" y="70" width="40" height="40" opacity=".6"/>
    <use href="#spark" x="760" y="960" width="44" height="44" opacity=".6"/>
  </g>
  <!-- confetti -->
  <g class="confettiThumb"></g>

  <!-- pets behind/around dice -->
  <g transform="translate(1335,595) rotate(-8)">
    <use href="#dice" transform="scale(1.45)"/>
  </g>
  <!-- dragon (mythic) top -->
  <g transform="translate(1190,110) rotate(-6) scale(1.45)">
    <use href="#dragon"/>
  </g>
  <!-- cat (rare) left -->
  <g transform="translate(905,500) rotate(-14) scale(1.15)"><use href="#cat"/></g>
  <!-- dog (legendary) right -->
  <g transform="translate(1590,640) rotate(12) scale(1.3)"><use href="#dog"/></g>

  <!-- rarity tags -->
  <g class="t" text-anchor="middle" font-size="44" paint-order="stroke" stroke="#2a1150" stroke-width="12" stroke-linejoin="round">
    <g transform="translate(1700,330) rotate(8)">
      <rect x="-150" y="-36" width="300" height="72" rx="36" fill="url(#mythic)" stroke-width="8"/>
      <text y="17" fill="#fff">MYTHIC</text>
    </g>
    <g transform="translate(1040,780) rotate(-10)">
      <rect x="-110" y="-32" width="220" height="64" rx="32" fill="url(#rare)" stroke-width="8"/>
      <text y="15" fill="#fff" font-size="40">RARE</text>
    </g>
    <g transform="translate(1735,975) rotate(8)">
      <rect x="-175" y="-34" width="350" height="68" rx="34" fill="url(#legend)" stroke-width="8"/>
      <text y="16" fill="#fff" font-size="42">LEGENDARY</text>
    </g>
  </g>

  <!-- TITLE -->
  <g class="t" paint-order="stroke" stroke-linejoin="round" transform="translate(80,0) rotate(-5 400 400)">
    <text x="0" y="395" font-size="330" fill="#2a1150" stroke="#2a1150" stroke-width="40" transform="translate(0,22)">ROLL</text>
    <text x="0" y="395" font-size="330" fill="url(#titleFill)" stroke="#2a1150" stroke-width="30">ROLL</text>
    <text x="22" y="665" font-size="250" fill="#2a1150" stroke="#2a1150" stroke-width="36" transform="translate(0,20)">A PET!</text>
    <text x="22" y="665" font-size="250" fill="url(#title2Fill)" stroke="#2a1150" stroke-width="26">A PET!</text>
  </g>

  <!-- CTA pill -->
  <g transform="translate(110,820) rotate(-4)">
    <rect x="0" y="0" width="760" height="120" rx="60" fill="#2a1150" transform="translate(0,12)"/>
    <rect x="0" y="0" width="760" height="120" rx="60" fill="url(#pill)" stroke="#2a1150" stroke-width="10"/>
    <rect x="34" y="16" width="692" height="30" rx="15" fill="#fff" opacity=".35"/>
    <text class="t" x="380" y="82" text-anchor="middle" font-size="62" fill="#fff" paint-order="stroke" stroke="#0d5a2c" stroke-width="12" stroke-linejoin="round">1 IN 1,000,000 PETS!</text>
  </g>
</svg>

<!-- ===================== ICON 512x512 ===================== -->
<svg id="icon" class="scene" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="url(#bgIcon)"/>
  <g transform="translate(256,330)" class="raysHere" opacity=".22"></g>
  <circle cx="256" cy="330" r="260" fill="url(#glow)"/>
  <g class="confettiIcon"></g>
  <use href="#spark" x="40" y="250" width="34" height="34"/>
  <use href="#spark" x="440" y="210" width="30" height="30" opacity=".85"/>
  <g transform="translate(262,355) rotate(-8) scale(.82)"><use href="#dice"/></g>
  <g transform="translate(150,84) rotate(-6) scale(1.1)"><use href="#cat"/></g>
  <g class="t" paint-order="stroke" stroke-linejoin="round" text-anchor="middle" transform="rotate(-5 256 80)">
    <text x="256" y="104" font-size="96" fill="#2a1150" stroke="#2a1150" stroke-width="22" transform="translate(0,8)">ROLL A PET</text>
    <text x="256" y="104" font-size="96" fill="url(#titleFill)" stroke="#2a1150" stroke-width="16">ROLL A PET</text>
  </g>
</svg>

<script>
  const NS='http://www.w3.org/2000/svg';
  document.body.className = location.hash.slice(1) || 'thumb';
  document.querySelectorAll('.raysHere').forEach(g=>{
    const n=18, R=1600;
    for(let i=0;i<n;i++){
      const a0=(i/n)*Math.PI*2, a1=a0+Math.PI/n;
      const p=document.createElementNS(NS,'path');
      p.setAttribute('d',`M0,0 L${R*Math.cos(a0)},${R*Math.sin(a0)} L${R*Math.cos(a1)},${R*Math.sin(a1)} Z`);
      p.setAttribute('fill','#fff'); g.appendChild(p);
    }
  });
  // deterministic confetti
  let s=7; const rnd=()=>((s=(s*9301+49297)%233280)/233280);
  const cols=['#ffd23f','#3ee07a','#36b6ff','#ff4fa3','#ffffff'];
  function confetti(sel,W,H,count,size,avoid){
    const g=document.querySelector(sel);
    for(let i=0;i<count;i++){
      const x=rnd()*W,y=rnd()*H; if(avoid(x,y)) continue;
      const r=document.createElementNS(NS,'rect');
      const w=size*(.6+rnd()*.8);
      r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width',w);r.setAttribute('height',w*.45);r.setAttribute('rx',w*.15);
      r.setAttribute('fill',cols[i%cols.length]);r.setAttribute('opacity',.85);
      r.setAttribute('transform',`rotate(${rnd()*360} ${x} ${y})`);g.appendChild(r);
    }
  }
  confetti('.confettiThumb',1920,1080,70,26,(x,y)=>x<880&&y>120&&y<960);
  confetti('.confettiIcon',512,512,26,12,(x,y)=>y<130);
</script>
</body></html>
