const INK = '#1d1033';

// ---------- canvas helpers ----------
function canvasTex(w, h, draw) {

function ellipse(x, cx, cy, rx, ry, fill) { x.beginPath(); x.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); x.fillStyle = fill; x.fill(); }

// ---------- avatar faces ----------

const faceTex = {}; for (const k in FACES) faceTex[k] = canvasTex(512, 512, (x) => FACES[k](x));

// ---------- avatar ----------
function avatar({ skin = '#f5c89a', shirt = '#2b2b33', pants = '#2c3e8c', shoes = '#1d1d24', hair = 'bacon', hairColor = '#5b3418', face = 'smirk', logo = null }) {

  head.add(rbox(1.3, 1.25, 1.25, mSkin, .22));
  const f = decal(faceTex[face], 1.12, 1.12); f.position.z = .63; head.add(f);

    for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; const sp = new THREE.Mesh(new THREE.ConeGeometry(.13, .38, 4), gold); sp.position.set(Math.sin(a) * .6, 1.3, Math.cos(a) * .6); head.add(sp);
      const gem = new THREE.Mesh(new THREE.SphereGeometry(.07, 12, 8), mat(['#ff2e63', '#36b6ff', '#3ee07a'][i % 3], { emissive: ['#ff2e63', '#36b6ff', '#3ee07a'][i % 3], emissiveIntensity: .6 })); gem.position.set(Math.sin(a) * .63, .98, Math.cos(a) * .63); head.add(gem); }

// ---------- pets ----------
const PAW = (x, cx, cy, s, col) => { x.fillStyle = col; ellipse(x, cx, cy + 13 * s, 17 * s, 14 * s, col); [[-22, -8], [-8, -20], [8, -20], [22, -8]].forEach(([dx, dy]) => ellipse(x, cx + dx * s, cy + dy * s, 8 * s, 8.5 * s, col)); };

      x.beginPath(); x.moveTo(215, 350); x.quadraticCurveTo(235, 375, 256, 350); x.quadraticCurveTo(277, 375, 297, 350); x.stroke(); }

}
const petFaces = {}; ['cat', 'dog', 'dragon', 'bunny', 'unicorn'].forEach(k => petFaces[k] = petFace(k));
function pet(kind, color, { glow = 0, glowColor = color, metal = 0 } = {}) {
  const g = new THREE.Group();
  const m = mat(color, { emissive: glowColor, emissiveIntensity: glow, metalness: metal, roughness: metal ? .3 : .42 });
  const body = rbox(1.6, 1.4, 1.45, m, .3); g.add(body);
  const f = decal(petFaces[kind], 1.35, 1.35); f.position.z = .73; f.position.y = -.05; g.add(f);
  for (const s of [-1, 1]) { const foot = rbox(.42, .3, .5, m, .1); foot.position.set(s * .45, -.78, .3); g.add(foot); }

  if (kind === 'dog') for (const s of [-1, 1]) { const e = rbox(.25, .8, .55, accent(new THREE.Color(color).multiplyScalar(.55).getStyle()), .1); e.position.set(s * .88, .15, 0); e.rotation.z = s * .25; g.add(e); }

    ['#ff7ad9', '#b46bff', '#36b6ff'].forEach((c, i) => { const mm = rbox(.34, .32, 1.0, accent(c), .12); mm.position.set(-.42 + i * .3, .82, -.15); g.add(mm); });
  }

    const gold = accent('#ffd23f', { metalness: .6, roughness: .3 });
    for (const s of [-1, 1]) { const h = new THREE.Mesh(new THREE.ConeGeometry(.14, .6, 12), gold); h.position.set(s * .45, .95, -.1); h.rotation.z = -s * .35; g.add(h); }
    for (let i = 0; i < 3; i++) { const sp = new THREE.Mesh(new THREE.ConeGeometry(.12, .3, 4), gold); sp.position.set(0, .82, .35 - i * .35); g.add(sp); }

// ---------- dice ----------
const pawTex = canvasTex(256, 256, x => PAW(x, 128, 128, 3, '#8b3dff'));
const pawTexPink = canvasTex(256, 256, x => PAW(x, 128, 128, 3, '#ff3d9a'));
function dice(glow = .25) {
  const g = new THREE.Group();
  g.add(rbox(1, 1, 1, mat('#f4efff', { emissive: '#ffe9a0', emissiveIntensity: glow * .35, clearcoat: 1, roughness: .2 }), .14));

  for (const [x, y, z, rx, ry, tex, pts] of faces) {
    const fg = new THREE.Group(); fg.position.set(x, y, z); fg.rotation.set(rx, ry, 0, 'YXZ'); g.add(fg);

function glowSprite(color, size, opacity = 1) {

}

const starTex = canvasTex(128, 128, (x) => { x.translate(64, 64); x.fillStyle = '#fff'; x.beginPath(); x.moveTo(0, -64); x.quadraticCurveTo(6, -6, 64, 0); x.quadraticCurveTo(6, 6, 0, 64); x.quadraticCurveTo(-6, 6, -64, 0); x.quadraticCurveTo(-6, -6, 0, -64); x.fill(); });

  for (let i = 0; i < n; i++) { const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: starTex, color, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));

    const paint = (a, b, c, px, py) => { const gr = x.createRadialGradient(px * W, py * H, 0, px * W, py * H, Math.max(W, H) * .8); gr.addColorStop(0, a); gr.addColorStop(.4, b); gr.addColorStop(1, c); x.fillStyle = gr; x.fillRect(0, 0, W, H);

// ---------- overlay text (SVG) ----------
const DEFS = `<defs>
 <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff3b6b"/><stop offset=".2" stop-color="#ff9a1f"/><stop offset=".4" stop-color="#ffe93f"/><stop offset=".6" stop-color="#3ee07a"/><stop offset=".8" stop-color="#36b6ff"/><stop offset="1" stop-color="#b46bff"/></linearGradient>
 <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a8a"/><stop offset=".5" stop-color="#ff2b2b"/><stop offset="1" stop-color="#b30000"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8ff7a"/><stop offset=".5" stop-color="#3ee05a"/><stop offset="1" stop-color="#119a2e"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7b0"/><stop offset=".45" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff8a1f"/></linearGradient>
 <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>`;
function txt(str, x, y, size, fill, { anchor = 'middle', rot = 0, outline = '#140a24', inner = '#ffffff' } = {}) {
  const sw = size * .13;
  return `<g class="t" transform="rotate(${rot} ${x} ${y})" text-anchor="${anchor}" font-size="${size}" paint-order="stroke" stroke-linejoin="round">
    <text x="${x}" y="${y + size * .07}" fill="${outline}" stroke="${outline}" stroke-width="${sw * 1.5}">${str}</text>
    <text x="${x}" y="${y}" fill="${fill}" stroke="${outline}" stroke-width="${sw}">${str}</text>
    <text x="${x}" y="${y}" fill="none" stroke="${inner}" stroke-width="${sw * .28}" opacity=".9">${str}</text>
    <text x="${x}" y="${y}" fill="url(#shine)">${str}</text></g>`;
}
let overlay = '';

// ---------- scenes ----------
const SCENES = {
  // 1. "0.0001%" — confident bacon hair holding the dice, giant glowing mythic dragon behind
  mythic() {
    scene.background = burstBg('#ff9bf0', '#7b2cff', '#12043d', .64, .42);
    lights({ rim: '#ff7ad9', rimI: 3 });
    camera.position.set(0, 4.3, 13); camera.lookAt(.2, 3.9, 0);
    const av = at(avatar({ shirt: '#1e1e26', pants: '#2b3a7a', face: 'smirk', logo: pawLogo }), -2.6, -.2, 1.5, 1, .35);
    const P = av.userData.P; P.armR.rotation.set(-.4, 0, 2.55); P.armL.rotation.z = -.15; P.head.rotation.set(.04, .1, -.06);
    av.updateMatrixWorld(true); const hand = P.armR.localToWorld(new THREE.Vector3(0, -2.2, 0));
    const d = at(dice(.9), hand.x + .1, hand.y + .6, hand.z + .4, 1.15, .6, .5, .2);
    at(glowSprite('#ffd23f', 3.6, .55), d.position.x + .3, d.position.y + .2, d.position.z - 1.4);
    at(rainbowAura(11), 3.2, 4.8, -7);
    at(pet('dragon', '#8a3dff', { glow: .08, glowColor: '#b46bff' }), 3.0, 4.6, -4, 2.1, -.12, .05);
    const pl = new THREE.PointLight('#d08bff', 25, 20); pl.position.set(3.4, 5, -1.5); scene.add(pl);
    sparkles(scene, 26, [-7, 9, 1, 9, -6, 2], 5);
    overlay = txt('0.0001%', W * .63, H * .9, 210, 'url(#rainbow)', { rot: -3 });
    return { bloom: [.35, .45, .97] };
  },
  // 2. NOOB vs PRO
  noobpro() {
    scene.background = burstBg(0, 0, 0, 0, 0, true, { left: ['#bfe3ff', '#5b8dd6', '#24305e', .22, .5], right: ['#fff1a8', '#ffb627', '#a63d00', .78, .45] });
    lights({ rim: '#ffd68a', rimI: 2.4 });
    camera.position.set(0, 4.0, 15.5); camera.lookAt(0, 3.3, 0);
    shadowFloor(0, .3);
    const noob = at(avatar({ skin: '#f7d33c', shirt: '#1f7fe0', pants: '#7bc142', shoes: '#7bc142', hair: 'none', face: 'sad' }), -4.3, 0, 0, 1, .32);
    const N = noob.userData.P; N.armL.rotation.set(-1.25, 0, .25); N.armR.rotation.set(-1.25, 0, -.25); N.head.rotation.x = .12;
    at(pet('cat', '#a8acb8'), -4.25, 2.7, 1.55, .75, .32);
    const pro = at(avatar({ skin: '#f5c89a', shirt: '#121218', pants: '#121218', hair: 'crown', hairColor: '#1a1a1f', face: 'smirk', logo: pawLogo }), 2.6, 0, 0, 1, -.3);
    const Pp = pro.userData.P; Pp.armR.rotation.set(0, 0, .3); Pp.armL.rotation.set(0, 0, -.12);
    at(glowSprite('#ffb627', 8, .45), 5.9, 5.0, -5);
    at(pet('dragon', '#ffc928', { glow: .06, glowColor: '#ff9d00', metal: .55 }), 5.9, 4.7, -2.2, 1.45, -.3);
    const pl = new THREE.PointLight('#ffcc66', 20, 18); pl.position.set(6, 6, -1); scene.add(pl);
    sparkles(scene, 18, [2, 10, 1, 9, -5, 1], 9, '#fff3b0');
    overlay = txt('NOOB', W * .2, H * .18, 170, 'url(#red)', { rot: -5 }) + txt('PRO', W * .66, H * .17, 190, 'url(#green)', { rot: 4 });
    return { bloom: [.3, .45, .97] };
  },
  // 3. Rolling outdoors — giant dice exploding with pets
  roll() {
    scene.background = skyBg();
    lights({ rim: '#ffffff', rimI: 1.4, hemiGround: '#5aa34a' });
    camera.position.set(0, 4.4, 19); camera.lookAt(.6, 3.6, 0);
    const grass = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshStandardMaterial({ color: '#52c43a', roughness: .9 })); grass.rotation.x = -Math.PI / 2; grass.receiveShadow = true; scene.add(grass);
    const d = at(dice(.5), 2.4, 2.6, -1, 4.2, .62, .28, .12);
    at(glowSprite('#ffe27a', 11, .4), 2.4, 4.2, -6);
    at(pet('dragon', '#8a3dff', { glow: .08, glowColor: '#b46bff' }), 2.6, 7.6, -2, 1.7, -.2, .1);
    at(rainbowAura(6), 2.6, 7.6, -4);
    at(pet('unicorn', '#f7f2ff'), 7.4, 5.3, -1, 1.35, -.5, 0, -.15);
    at(pet('cat', '#ffa94d'), -1.6, 6.2, -.5, 1.25, .35, 0, .2);
    at(pet('dog', '#e9b57d'), 7.0, 1.0, 1.2, 1.3, -.4);
    at(pet('bunny', '#e8e2f7'), -1.3, 1.0, 2.6, 1.0, .3);
    const av = at(avatar({ shirt: '#2f9bff', pants: '#26306e', face: 'grin', logo: pawLogo }), -5.0, 0, 2.5, 1, .45);
    const P = av.userData.P; P.armL.rotation.z = -2.7; P.armR.rotation.z = 2.7; P.head.rotation.x = -.08;
    sparkles(scene, 30, [-3, 10, 1, 10, -4, 2], 13, '#fff6c8');
    return { bloom: [.25, .45, .98] };
  },
  // Icon: bacon hair + glowing dice + RNG
  icon() {
    scene.background = burstBg('#ff9bf0', '#7b2cff', '#12043d', .5, .45);
    lights({ rim: '#ff7ad9', rimI: 3 });
    camera.position.set(0, 4.7, 9.5); camera.lookAt(.35, 4.35, 0);
    const av = at(avatar({ shirt: '#1e1e26', face: 'smirk', logo: pawLogo }), -.3, 0, 0, 1, .3);
    const P = av.userData.P; P.armR.rotation.set(-.3, 0, 2.3); P.head.rotation.z = -.05;
    av.updateMatrixWorld(true); const hand = P.armR.localToWorld(new THREE.Vector3(0, -2.2, 0));
    at(glowSprite('#ffd23f', 3, .5), hand.x + .3, hand.y + .7, hand.z - 1.4);
    at(dice(1), hand.x + .2, hand.y + .55, hand.z + .3, 1.05, .6, .5, .2);
    sparkles(scene, 10, [-3, 4, 3, 7, -2, 1], 21);
    overlay = txt('RNG', W * .5, H * .93, 140, 'url(#rainbow)', { rot: -4 });
    return { bloom: [.35, .45, .97] };
  },
};

const cfg = SCENES[SCENE]();
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), ...cfg.bloom));
composer.addPass(new OutputPass());
// Composite the 3D render and the SVG text overlay into one PNG (headless screenshots of WebGL are unreliable).
window.renderPNG = async () => {
  composer.render();
  const out = document.createElement('canvas'); out.width = W; out.height = H;
  const ctx = out.getContext('2d'); ctx.drawImage(renderer.domElement, 0, 0);
  if (overlay) {
    const buf = await (await fetch('./LuckiestGuy.woff2')).arrayBuffer();
    let bin = ''; new Uint8Array(buf).forEach(b => bin += String.fromCharCode(b));
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><style>@font-face{font-family:'LG';src:url(data:font/woff2;base64,${btoa(bin)}) format('woff2')}.t{font-family:'LG'}</style>${DEFS}${overlay}</svg>`;
    const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); await img.decode();
    ctx.drawImage(img, 0, 0);
  }
  return out.toDataURL('image/png');
};
window.done = true;
</script></body></html>
