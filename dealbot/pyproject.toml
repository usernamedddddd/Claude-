[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dealbot"
version = "0.1.0"
description = "Finds penny items and clearance deals at stores near you"
requires-python = ">=3.11"
dependencies = []            # standard library only

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dealbot = "dealbot.cli:main"

[tool.setuptools]
packages = ["dealbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
