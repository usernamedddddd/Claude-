[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memebot"
version = "0.1.0"
description = "Solana memecoin scanner and trading bot (paper trading by default)"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
live = ["solders>=0.21", "base58>=2.1"]
dev = ["pytest>=8"]

[project.scripts]
memebot = "memebot.cli:main"

[tool.setuptools]
packages = ["memebot"]
